<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro Journal</title>
  <link rel="stylesheet" href="d.css" />
  
</head>
<body>
  <div class="container">
   <header>
  <div class="header-left">
    <span class="streak" id="streak">🔥 0 day</span>
  </div>

  <h1>DrukYig</h1>

  <div class="header-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</header>

    <div class="input-area">
      <textarea id="entryInput" placeholder="Write one sentence about your day..." maxlength="150"></textarea>
      <div class="char-count"><span id="charCount">0</span>/150</div>
      <button class="save" id="saveBtn" disabled>Save Entry</button>
      <div class="saved-msg" id="savedMsg">Saved!</div>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="Search entries..." />

    <div class="entries" id="entriesList"></div>
  </div>

  <script src="j.js"></script>
</body>
</html>
